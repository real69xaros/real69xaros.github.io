<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XIS AntiCheat — Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Installation, configuration and API reference for XIS AntiCheat.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'XIS AntiCheat',
      nameLink: '#/',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      relativePath: false,
      notFoundPage: true,
      // repo: 'you/xis-antiCheat-docs',   // uncomment once it lives in a repo
      search: {
        depth: 4,
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the docs…',
        noData: 'Nothing matches that.',
        hideOtherSidebarContent: false
      },
      // Wrap tables so a wide one scrolls inside itself instead of
      // pushing the whole page sideways on narrow screens.
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var tables = document.querySelectorAll('.markdown-section table');
            for (var i = 0; i < tables.length; i++) {
              var t = tables[i];
              if (t.parentElement && t.parentElement.className === 'table-scroll') continue;
              var w = document.createElement('div');
              w.className = 'table-scroll';
              t.parentNode.insertBefore(w, t);
              w.appendChild(t);
            }
          });
        }
      ],
      copyCode: {
        buttonText: 'copy',
        errorText: 'error',
        successText: 'copied'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
</body>
</html>
