<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XIS AntiCheat — Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Installation, configuration and API reference for XIS AntiCheat.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128737;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="custom.css">
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'XIS AntiCheat',
      nameLink: '#/',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      relativePath: false,
      notFoundPage: true,
      // repo: 'you/xis-antiCheat-docs',   // uncomment once it lives in a repo
      search: {
        depth: 4,
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search the docs…',
        noData: 'Nothing matches that.',
        hideOtherSidebarContent: false
      },
      // Wrap tables so a wide one scrolls inside itself instead of
      // pushing the whole page sideways on narrow screens.
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var tables = document.querySelectorAll('.markdown-section table');
            for (var i = 0; i < tables.length; i++) {
              var t = tables[i];
              if (t.parentElement && t.parentElement.className === 'table-scroll') continue;
              var w = document.createElement('div');
              w.className = 'table-scroll';
              t.parentNode.insertBefore(w, t);
              w.appendChild(t);
            }
          });
        }
      ],
      copyCode: {
        buttonText: 'copy',
        errorText: 'error',
        successText: 'copied'
      }
    }
  </script>
  <!--
    Shim to avoid Uncaught SyntaxError: Failed to execute 'querySelector' on 'Document': '#/install' is not a valid selector.
    Some versions/plugins call querySelector with raw hashes like '#/install' which are invalid CSS selectors
    because of the slash. This shim catches that specific error and falls back to getElementById.
    Inserted before docsify scripts so it intercepts their calls.
  -->
  <script>
    console.info('docs: selector & navigation fallbacks loaded');
    (function () {
      function makeSafe(orig) {
        return function (selector) {
          try {
            return orig.call(this, selector);
          } catch (err) {
            // If selector is a string that starts with '#' (e.g. '#/install'), try fallback using getElementById
            if (typeof selector === 'string' && selector.length > 1 && selector.charAt(0) === '#') {
              try {
                var id = selector.slice(1); // remove leading '#'
                // document.getElementById accepts IDs with slashes and other characters that are invalid in CSS selectors
                return document.getElementById(id);
              } catch (e2) {
                // ignore and rethrow original error
              }
            }
            throw err;
          }
        };
      }

      if (typeof Document !== 'undefined' && Document.prototype && Document.prototype.querySelector) {
        Document.prototype.querySelector = makeSafe(Document.prototype.querySelector);
      }
      if (typeof Element !== 'undefined' && Element.prototype && Element.prototype.querySelector) {
        Element.prototype.querySelector = makeSafe(Element.prototype.querySelector);
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <!--
    Fallback click handler: some environments or plugins may not initialize docsify's click interception.
    This handler ensures anchors with hrefs like "#/install" and "#/api" still navigate by setting location.hash
    and dispatching a hashchange event so docsify (if running) picks it up.
  -->
  <script>
    (function () {
      function onDocClick(e) {
        try {
          var a = e.target;
          while (a && a.nodeName !== 'A') a = a.parentNode;
          if (!a || !a.getAttribute) return;
          var href = a.getAttribute('href');
          if (!href) return;
          // Only handle internal docsify-style hashes like #/something
          if (href.indexOf('#/') === 0) {
            e.preventDefault();
            console.info('docs: fallback handling', href);
            // If the hash is already set, still dispatch a hashchange so routers respond.
            if (location.hash !== href) {
              location.hash = href;
            } else {
              // same hash -> manually emit hashchange
              try {
                window.dispatchEvent(new HashChangeEvent('hashchange'));
              } catch (err) {
                // older browsers
                var ev = document.createEvent('Event');
                ev.initEvent('hashchange', true, true);
                window.dispatchEvent(ev);
              }
            }
          }
        } catch (err) {
          // don't break page interactions
          console.error('docs: navigation fallback error', err);
        }
      }

      document.addEventListener('click', onDocClick, false);
    })();
  </script>
</body>
</html>
